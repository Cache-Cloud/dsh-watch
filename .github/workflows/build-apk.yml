name: Build APK

# 在 GitHub 上直接出 APK——不需要本机装 Android SDK，也不需要 JDK。
#
# 触发方式：
#   1. 手动（Actions 页面的 Run workflow）
#   2. 推送到 main/master
#   3. 打 tag（v*）时额外发一个 Release，附上 APK
#
# 产物：dsh-watch-apk（可在 Actions 运行页的 Artifacts 里下载）。

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（显示在手表上）'
        required: false
        default: '1.0.0'
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-bt34-jar35-v1

      - name: 准备 Android SDK
        run: |
          chmod +x scripts/*.sh
          scripts/fetch-sdk.sh --dest "${{ runner.temp }}/android-sdk"

      - name: 构建 APK
        env:
          # 仓库自带的固定调试密钥：保证每次 CI 产出的 APK 签名一致，
          # 否则每次新密钥都会让「覆盖安装」失败（不同签名的 APK 不能升级安装）。
          # 这是公开的侧载用密钥，不要用它签任何要发布到应用商店的东西。
          DSH_WATCH_KEYSTORE: ${{ github.workspace }}/keystore/dsh-watch.jks
          DSH_WATCH_KEYSTORE_PASSWORD: dsh-watch
          DSH_WATCH_KEY_ALIAS: dsh-watch
        run: |
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          scripts/build-apk.sh \
            --sdk "${{ runner.temp }}/android-sdk" \
            --java-home "$JAVA_HOME" \
            --output dist \
            --version-name "$VERSION" \
            --version-code "${{ github.run_number }}"

      - name: 校验 APK
        run: |
          BT="${{ runner.temp }}/android-sdk/build-tools/34.0.0"
          "$BT/aapt2" dump badging "dist/DSH手表.apk" | head -6
          "$BT/apksigner" verify --verbose "dist/DSH手表.apk" | head -6

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-watch-apk
          path: dist/DSH手表.apk
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DSH手表.apk
          generate_release_notes: true
